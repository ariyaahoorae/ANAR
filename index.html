<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر فروش انار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b3202f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf6f1;--fg:#221a1a;--card:#fff;--mut:#7a6d6d;--acc:#b3202f;--ok:#1a7f4b;--warn:#b7791f;--bd:#eadfd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16100f;--fg:#f3ebe6;--card:#211817;--mut:#a89a96;--acc:#ff6b7a;--ok:#4cc38a;--warn:#e0b050;--bd:#352826;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16100f;--fg:#f3ebe6;--card:#211817;--mut:#a89a96;--acc:#ff6b7a;--ok:#4cc38a;--warn:#e0b050;--bd:#352826;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{margin:0;font-size:22px}
#st{font-size:12px;color:var(--mut)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.s{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;display:grid}
.s small{color:var(--mut);font-size:11px}.s b{font-size:17px}
.pos{color:var(--ok)}.neg{color:var(--acc)}.wr{color:var(--warn)}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;padding:8px 4px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fm .w{grid-column:1/-1}
label{font-size:12px;color:var(--mut);display:grid;gap:2px}
input,select{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=checkbox]{width:auto}
.ck{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:14px}
button.pri{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.it{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.it small,.mut{color:var(--mut);font-size:12px}
.tot{text-align:left;font-weight:700}
.tg{border:0;border-radius:20px;padding:0 10px;font:inherit;font-size:11px;cursor:pointer}
.tg.p{background:rgba(26,127,75,.15);color:var(--ok)}.tg.u{background:rgba(183,121,31,.18);color:var(--warn)}
.x{border:0;background:transparent;color:var(--mut);font:inherit;font-size:18px;cursor:pointer}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.ov{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:420px}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:right}
th{color:var(--mut);font-weight:400}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px;font-size:13px;text-align:center}
.ci{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:6px;font-size:12px}
.ci .tot{text-align:right;margin:2px 0}
nav button{font-size:12px}
.ac{display:flex}
.it.ed{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
nav button{flex:0 0 auto;padding:8px 12px;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>دفتر فروش انار</h1>
<div id="st">در حال بارگذاری…</div>
<div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('fa-IR'),f=n=>nf.format(Math.round(n));
const num=v=>{v=String(v||'').replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[,٬،\s]/g,'');const n=parseFloat(v);return isFinite(n)?n:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const jd=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('fa-IR')}catch(e){return d}};
const GR=[{k:'g1',n:'درجه ۱ (از ۳۰۰ گرم)'},{k:'g2',n:'درجه ۲ (۱۵۰ تا ۳۰۰)'},{k:'g3',n:'درجه ۳ (زیر ۱۵۰)'}];
const GN=Object.fromEntries(GR.map(g=>[g.k,g.n]));
const PM={card:'کارت به کارت',pos:'پوز',cash:'نقدی'};
const CATS=['کارگر و برداشت','بسته‌بندی','ارسال','تبلیغات','سایر'];
const DEF={settings:{rent:550000000,price:{g1:160000,g2:100000,g3:50000},stock:{g1:10000,g2:0,g3:0}},sales:[],exp:[]};
let S=JSON.parse(JSON.stringify(DEF)),ref=null,tab='sales',q=Promise.resolve(),EDIT=null;
const setSt=t=>{$('#st').textContent=t};

function persist(){
  try{localStorage.setItem('anar_books',JSON.stringify(S));setSt('ذخیره شد ✓ در حافظه‌ی گوشی')}
  catch(e){setSt('ذخیره نشد؛ فضای حافظه یا تنظیمات مرورگر را بررسی کن')}
}
function init(){
  try{const v=JSON.parse(localStorage.getItem('anar_books'));if(v&&v.settings)S=Object.assign({},DEF,v)}catch(e){}
  setSt('داده‌ها در حافظه‌ی همین گوشی ذخیره می‌شوند');
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
}
function stats(){
  let rev=0,paid=0;const sold={g1:0,g2:0,g3:0},revg={g1:0,g2:0,g3:0};
  S.sales.forEach(s=>{const t=s.kg*s.price;rev+=t;if(s.paid)paid+=t;sold[s.g]+=s.kg;revg[s.g]+=t});
  const ex=S.exp.reduce((a,e)=>a+e.amt,0),cost=S.settings.rent+ex;
  return{rev,paid,sold,revg,ex,cost,net:rev-cost};
}

const card=(l,v,c)=>`<div class="s"><small>${l}</small><b class="${c||''}">${f(v)}</b><small>تومان</small></div>`;

function splitV(){
  const srt=a=>[...a].sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
  const col=(ttl,arr,paid)=>{const sum=arr.reduce((a,s)=>a+s.kg*s.price,0);
    return `<div class="cl"><div class="ch ${paid?'pos':'wr'}"><b>${ttl}</b><br>${f(sum)} تومان<br><small>${f(arr.length)} فروش</small></div>${arr.map(s=>`<div class="ci"><b>${esc(s.c||'مشتری')}</b><br><small>${jd(s.d)} · ${f(s.kg)} کیلو${s.paid&&s.m?' · '+PM[s.m]:''}</small><div class="tot">${f(s.kg*s.price)}</div><button class="tg ${paid?'u':'p'}" data-act="paid" data-id="${s.id}">${paid?'برگشت به نسیه':'دریافت شد'}</button> <button class="tg" style="background:var(--bd);color:var(--fg)" data-act="editS" data-id="${s.id}">ویرایش</button></div>`).join('')||'<p class="mut">—</p>'}</div>`};
  return `<div class="cols">${col('پرداخت‌شده',srt(S.sales.filter(s=>s.paid)),true)}${col('پرداخت نشده',srt(S.sales.filter(s=>!s.paid)),false)}</div>`;
}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anar-backup-'+today()+'.json';a.click();setSt('فایل پشتیبان ساخته شد')}
function impFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v.settings)throw 0;S=Object.assign({},DEF,v);persist();render();setSt('بازیابی شد ✓')}catch(e){setSt('فایل معتبر نیست')}};r.readAsText(file)}
function sizeV(){
  const s=stats(),cnt={g1:0,g2:0,g3:0};S.sales.forEach(x=>cnt[x.g]++);
  const kgT=GR.reduce((a,g)=>a+s.sold[g.k],0);
  const rows=GR.map(g=>{const kg=s.sold[g.k],rv=s.revg[g.k],pc=s.rev?rv/s.rev*100:0;
    return `<div class="card"><b>${g.n}</b><div class="bar"><i style="width:${pc}%"></i></div><div class="kv"><span>حجم فروش</span><b>${f(kg)} کیلو</b></div><div class="kv"><span>درآمد</span><b>${f(rv)} تومان</b></div><div class="kv"><span>سهم از درآمد</span><b>${f(pc)}٪</b></div><div class="kv"><span>تعداد فروش</span><b>${f(cnt[g.k])}</b></div><div class="kv"><span>میانگین قیمت هر کیلو</span><b>${f(kg?rv/kg:0)}</b></div></div>`}).join('');
  return rows+`<div class="card"><b>جمع کل</b><div class="kv"><span>حجم کل</span><b>${f(kgT)} کیلو</b></div><div class="kv"><span>درآمد کل</span><b>${f(s.rev)} تومان</b></div></div>`;
}
function payV(){
  const M=[['card','کارت به کارت'],['pos','پوز'],['cash','نقدی'],['','ثبت‌نشده']];
  const paid=S.sales.filter(x=>x.paid),tot=paid.reduce((a,x)=>a+x.kg*x.price,0);
  const rows=M.map(m=>{
    const a=paid.filter(x=>(x.m||'')===m[0]);
    if(m[0]===''&&!a.length)return '';
    const sum=a.reduce((t,x)=>t+x.kg*x.price,0),pc=tot?sum/tot*100:0;
    return `<div class="card"><b>${m[1]}</b><div class="bar"><i style="width:${pc}%"></i></div><div class="kv"><span>مبلغ دریافتی</span><b>${f(sum)} تومان</b></div><div class="kv"><span>تعداد فروش</span><b>${f(a.length)}</b></div><div class="kv"><span>سهم</span><b>${f(pc)}٪</b></div></div>`}).join('');
  const un=S.sales.filter(x=>!x.paid).reduce((a,x)=>a+x.kg*x.price,0);
  return rows+`<div class="card"><div class="kv"><span>جمع دریافتی</span><b class="pos">${f(tot)} تومان</b></div><div class="kv"><span>هنوز دریافت نشده</span><b class="wr">${f(un)} تومان</b></div></div><p class="mut">برای مشخص‌کردن روش پرداخت یک فروش، روی ✎ آن بزن.</p>`;
}
function salesV(){
  const opts=GR.map(g=>`<option value="${g.k}">${g.n}</option>`).join('');
  const list=[...S.sales].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(s=>`<div class="it${EDIT&&EDIT.k==='s'&&EDIT.id===s.id?' ed':''}"><div><b>${esc(s.c||'مشتری')}</b> · ${jd(s.d)}<br><small>${GN[s.g]} · ${f(s.kg)} کیلو × ${f(s.price)}${s.paid&&s.m?' · '+PM[s.m]:''}</small></div><div class="tot">${f(s.kg*s.price)}<br><button class="tg ${s.paid?'p':'u'}" data-act="paid" data-id="${s.id}">${s.paid?'پرداخت‌شده':'پرداخت نشده'}</button></div><div class="ac"><button class="x" data-act="editS" data-id="${s.id}" aria-label="ویرایش">✎</button><button class="x" data-act="delS" data-id="${s.id}" aria-label="حذف">×</button></div></div>`).join('')||'<p class="mut">هنوز فروشی ثبت نشده.</p>';
  return `<div class="card fm"><label>تاریخ<input id="sd" type="date" value="${today()}"></label><label>مشتری<input id="cu" placeholder="نام (اختیاری)"></label><label>درجه<select id="gr">${opts}</select></label><label>وزن (کیلو)<input id="kg" inputmode="decimal" placeholder="۱۰"></label><label class="w">قیمت هر کیلو (تومان)<input id="pr" inputmode="decimal" value="${f(S.settings.price.g1)}"></label><label class="w">روش پرداخت<select id="pm"><option value="">— انتخاب کن —</option><option value="card">کارت به کارت</option><option value="pos">پوز</option><option value="cash">نقدی</option></select></label><label class="ck w"><input id="pd" type="checkbox" checked> پرداخت شده</label><div class="w mut" id="pv">جمع: ۰ تومان</div><button class="pri w" data-act="addS">ثبت فروش</button></div>${list}`;
}

function expV(){
  const list=[...S.exp].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(e=>`<div class="it${EDIT&&EDIT.k==='e'&&EDIT.id===e.id?' ed':''}"><div><b>${esc(e.t||e.c)}</b> · ${jd(e.d)}<br><small>${esc(e.c)}</small></div><div class="tot">${f(e.amt)}</div><div class="ac"><button class="x" data-act="editE" data-id="${e.id}" aria-label="ویرایش">✎</button><button class="x" data-act="delE" data-id="${e.id}" aria-label="حذف">×</button></div></div>`).join('')||'<p class="mut">هنوز هزینه‌ای ثبت نشده.</p>';
  return `<div class="card fm"><label>تاریخ<input id="ed" type="date" value="${today()}"></label><label>دسته<select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="w">شرح<input id="et" placeholder="مثلاً ۵۰ جعبه ۵ کیلویی"></label><label class="w">مبلغ (تومان)<input id="ea" inputmode="decimal"></label><button class="pri w" data-act="addE">ثبت هزینه</button></div>${list}`;
}

function repV(){
  const s=stats(),pct=s.cost?Math.min(100,s.rev/s.cost*100):0;
  let potential=0;
  const rows=GR.map(g=>{const rem=S.settings.stock[g.k]-s.sold[g.k],pv=Math.max(rem,0)*S.settings.price[g.k];potential+=pv;return `<tr><td>${g.n}</td><td>${f(s.sold[g.k])}</td><td>${f(s.revg[g.k])}</td><td>${f(rem)}</td><td>${f(pv)}</td></tr>`}).join('');
  const byC=CATS.map(c=>[c,S.exp.filter(e=>e.c===c).reduce((a,e)=>a+e.amt,0)]).filter(x=>x[1]).map(x=>`<tr><td>${x[0]}</td><td>${f(x[1])}</td></tr>`).join('');
  return `<div class="card"><b>سربه‌سر شدن</b><div class="bar"><i style="width:${pct}%"></i></div><small class="mut">${f(pct)}٪ از هزینه‌ها (${f(s.cost)} تومان، شامل اجاره) پوشش داده شده. ${s.net>=0?'سود خالص تا اینجا '+f(s.net)+' تومان':'هنوز '+f(-s.net)+' تومان تا سربه‌سر مانده'}.</small></div>
<div class="card ov"><table><tr><th>درجه</th><th>فروخته (کیلو)</th><th>درآمد</th><th>مانده (کیلو)</th><th>درآمد مانده*</th></tr>${rows}</table></div>
<div class="card"><small class="mut">*اگر کل موجودی باقی‌مانده به قیمت‌های تنظیم‌شده فروش برود، سود پیش‌بینی‌شده: <b class="${s.net+potential>=0?'pos':'neg'}">${f(s.net+potential)}</b> تومان. این فقط تخمین است.</small></div>
<div class="card ov"><b>هزینه‌ها بر اساس دسته</b><table><tr><td>اجاره‌ی درختان</td><td>${f(S.settings.rent)}</td></tr>${byC}</table></div>`;
}

function setV(){
  const st=S.settings,fi=(l,k,v)=>`<label>${l}<input data-set="${k}" inputmode="decimal" value="${f(v)}"></label>`;
  return `<div class="card fm"><div class="w"><b>هزینه‌ی ثابت</b></div>${fi('اجاره‌ی درختان (تومان)','rent',st.rent).replace('<label','<label class="w"')}<div class="w"><b>قیمت هر کیلو</b></div>${GR.map(g=>fi(g.n,'price.'+g.k,st.price[g.k])).join('')}<div class="w"><b>موجودی برآوردی (کیلو)</b></div>${GR.map(g=>fi(g.n,'stock.'+g.k,st.stock[g.k])).join('')}</div><div class="card fm"><div class="w"><b>پشتیبان‌گیری</b><br><small class="mut">اگر اطلاعات مرورگر پاک شود، داده‌ها هم پاک می‌شوند. هر چند وقت یک نسخه‌ی پشتیبان ذخیره کن.</small></div><button class="pri" data-act="bk">ذخیره‌ی پشتیبان</button><button class="pri" data-act="imp">بازیابی از فایل</button><input id="fl" type="file" accept=".json,application/json" hidden></div><button class="pri" style="width:100%;opacity:.8" data-act="reset">پاک‌کردن همه‌ی داده‌ها</button>`;
}

function render(){
  const s=stats();
  const T=[['sales','فروش'],['exp','هزینه'],['split','تفکیک'],['rep','گزارش'],['size','سایزها'],['pay','روش پرداخت'],['set','تنظیمات']];
  $('#app').innerHTML=`<div class="sum">${card('درآمد کل',s.rev)}${card('دریافت‌شده',s.paid,'pos')}${card('طلب (نسیه)',s.rev-s.paid,s.rev-s.paid>0?'wr':'')}${card('سود خالص',s.net,s.net>=0?'pos':'neg')}</div><nav>${T.map(t=>`<button data-act="tab" data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>${{sales:salesV,exp:expV,split:splitV,rep:repV,size:sizeV,pay:payV,set:setV}[tab]()}`;fillEdit();
}

function addSale(){
  const kg=num($('#kg').value),price=num($('#pr').value);
  if(kg<=0||price<=0){setSt('وزن و قیمت را وارد کن');return}
  S.sales.push({id:Date.now(),d:$('#sd').value||today(),c:$('#cu').value.trim(),g:$('#gr').value,kg,price,paid:$('#pd').checked,m:$('#pm').value});
  persist();render();
}
function addExp(){
  const amt=num($('#ea').value);
  if(amt<=0){setSt('مبلغ را وارد کن');return}
  S.exp.push({id:Date.now(),d:$('#ed').value||today(),c:$('#ec').value,t:$('#et').value.trim(),amt});
  persist();render();
}
function fillEdit(){
  if(!EDIT)return;
  const cx='<button class="pri w" style="background:var(--mut)" data-act="cancel">انصراف</button>';
  if(EDIT.k==='s'){
    const s=S.sales.find(x=>x.id===EDIT.id);if(!s){EDIT=null;return}
    $('#sd').value=s.d;$('#cu').value=s.c;$('#gr').value=s.g;$('#kg').value=s.kg;$('#pr').value=f(s.price);$('#pd').checked=s.paid;$('#pm').value=s.m||'';preview();
    const b=document.querySelector('[data-act="addS"]');b.dataset.act='saveS';b.textContent='ذخیره‌ی ویرایش';b.insertAdjacentHTML('afterend',cx);
  }else{
    const e=S.exp.find(x=>x.id===EDIT.id);if(!e){EDIT=null;return}
    $('#ed').value=e.d;$('#ec').value=e.c;$('#et').value=e.t;$('#ea').value=f(e.amt);
    const b=document.querySelector('[data-act="addE"]');b.dataset.act='saveE';b.textContent='ذخیره‌ی ویرایش';b.insertAdjacentHTML('afterend',cx);
  }
  $('#app').scrollIntoView({behavior:'smooth'});
}
function saveS(){
  const kg=num($('#kg').value),price=num($('#pr').value);
  if(kg<=0||price<=0){setSt('وزن و قیمت را وارد کن');return}
  const s=S.sales.find(x=>x.id===EDIT.id);
  if(s){s.d=$('#sd').value||s.d;s.c=$('#cu').value.trim();s.g=$('#gr').value;s.kg=kg;s.price=price;s.paid=$('#pd').checked;s.m=$('#pm').value}
  EDIT=null;persist();render();
}
function saveE(){
  const amt=num($('#ea').value);
  if(amt<=0){setSt('مبلغ را وارد کن');return}
  const e=S.exp.find(x=>x.id===EDIT.id);
  if(e){e.d=$('#ed').value||e.d;e.c=$('#ec').value;e.t=$('#et').value.trim();e.amt=amt}
  EDIT=null;persist();render();
}
function preview(){const p=$('#pv');if(p)p.textContent='جمع: '+f(num($('#kg').value)*num($('#pr').value))+' تومان'}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=+b.dataset.id;
  if(a==='delS'||a==='delE'||a==='reset'){
    if(b.dataset.arm!=='1'){const old=b.textContent;b.dataset.arm='1';b.textContent=a==='reset'?'برای تأیید دوباره بزن':'حذف؟';setTimeout(()=>{b.dataset.arm='';b.textContent=old},3000);return}
    EDIT=null;
    if(a==='delS')S.sales=S.sales.filter(x=>x.id!==id);
    else if(a==='delE')S.exp=S.exp.filter(x=>x.id!==id);
    else S=JSON.parse(JSON.stringify(DEF));
    persist();render();return;
  }
  if(a==='tab'){EDIT=null;tab=b.dataset.t;render()}
  else if(a==='addS')addSale();
  else if(a==='saveS')saveS();
  else if(a==='saveE')saveE();
  else if(a==='editS'){EDIT={k:'s',id};tab='sales';render()}
  else if(a==='editE'){EDIT={k:'e',id};tab='exp';render()}
  else if(a==='cancel'){EDIT=null;render()}
  else if(a==='bk')backup();
  else if(a==='imp')$('#fl').click();
  else if(a==='addE')addExp();
  else if(a==='paid'){const s=S.sales.find(x=>x.id===id);if(s){s.paid=!s.paid;persist();render()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fl'){impFile(t.files[0])}
  else if(t.id==='gr'){if(!EDIT)$('#pr').value=f(S.settings.price[t.value]);preview()}
  else if(t.dataset.set){
    const [a,k]=t.dataset.set.split('.'),v=num(t.value);
    if(k)S.settings[a][k]=v;else S.settings[a]=v;
    persist();render();
  }
});
document.addEventListener('input',e=>{if(e.target.id==='kg'||e.target.id==='pr')preview()});
init();
</script>
</body>
</html>
